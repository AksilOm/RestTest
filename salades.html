<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Nos Salades - L'Arôme Gourmet Menu Numérique">
  <meta name="theme-color" content="#141416">
  <title>Nos Salades | L'Arôme Gourmet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-category="salades">

  <!-- STICKY HEADER -->
  <header class="site-header" id="site-header">
    <div class="container header-container">
      <div class="header-left">
        <a href="index.html" class="back-btn" id="back-link" aria-label="Accueil">
          <span class="back-arrow">←</span>
        </a>
        <a href="index.html" class="brand-link">
          <span class="brand-icon">🍽️</span>
          <div class="brand-text">
            <span id="header-name" class="brand-name">L'Arôme Gourmet</span>
            <span id="header-badge" class="brand-badge">Digital Menu</span>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <button id="lang-toggle-btn" class="header-action-btn lang-toggle-btn" type="button" aria-label="Changer de langue">
          <span id="lang-toggle-text">عربي</span>
        </button>
      </div>
    </div>
  </header>

  <!-- STICKY CATEGORY NAV BAR -->
  <nav class="category-nav-bar" id="category-nav-bar" aria-label="Menu categories">
    <div class="container category-nav-inner">
      <div class="nav-carousel-wrapper">
        <button class="nav-arrow nav-arrow-left" id="nav-arrow-left" type="button" aria-label="Précédent">&#8249;</button>
        <div class="category-tabs" id="category-tabs">
        <!-- Rendered dynamically by script.js -->
      </div>
        <button class="nav-arrow nav-arrow-right" id="nav-arrow-right" type="button" aria-label="Suivant">&#8250;</button>
      </div>
      <button id="data-saver-btn" class="data-saver-btn" type="button" aria-label="Mode économique de données">
        <span>⚡</span>
        <span id="data-saver-text">Éco</span>
      </button>
    </div>
  </nav>

  <!-- CATEGORY PAGE CONTENT -->
  <main class="main-content">
    <div class="container">
      <section class="category-banner" id="category-banner">
        <h1 id="category-title" class="category-banner-title">Nos Salades</h1>
        <p id="category-desc" class="category-banner-desc">Salades fraîches, croquantes et assaisonnées avec des ingrédients bio</p>
      </section>

      <div id="category-items-grid" class="items-grid">
        <!-- JS populates item cards -->
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <span id="footer-restaurant-name" class="footer-name">L'Arôme Gourmet</span>
        <p id="footer-sub" class="footer-sub">Scannez & Profitez • Menu Numérique</p>
      </div>

      <div id="footer-copyright" class="footer-bottom">
        &copy; 2026 L'Arôme Gourmet. Tous droits réservés.
      </div>
    </div>
  </footer>

  <script src="menu-data.js"></script>
  <script src="sheet-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
